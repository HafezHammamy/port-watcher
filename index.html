<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';" />
  <title>Port Watcher</title>
  <style>
    :root {
      --bg: #1e1e2e;
      --panel: #28283c;
      --row: #2a2a40;
      --row-alt: #25253a;
      --text: #cdd6f4;
      --muted: #8a8aa3;
      --accent: #89b4fa;
      --danger: #f38ba8;
      --danger-hi: #f87199;
      --border: #383850;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      font-size: 13px;
    }
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    header h1 {
      font-size: 15px;
      margin: 0 12px 0 0;
      font-weight: 600;
    }
    #search {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }
    #search:focus { border-color: var(--accent); }
    button {
      background: var(--accent);
      color: #1e1e2e;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover { filter: brightness(1.1); }
    .toolbar-info { color: var(--muted); font-size: 12px; white-space: nowrap; }
    label.auto { display: flex; align-items: center; gap: 6px; color: var(--muted); cursor: pointer; white-space: nowrap; }
    .scroll { flex: 1; overflow: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    thead th {
      position: sticky;
      top: 0;
      background: var(--panel);
      text-align: left;
      padding: 10px 14px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
    }
    thead th:hover { color: var(--text); }
    tbody td { padding: 8px 14px; border-bottom: 1px solid var(--border); }
    tbody tr:nth-child(even) { background: var(--row-alt); }
    tbody tr:hover { background: var(--row); }
    .proto { font-weight: 600; color: var(--accent); }
    .port { font-weight: 700; font-variant-numeric: tabular-nums; }
    .pid { color: var(--muted); font-variant-numeric: tabular-nums; }
    .mono { font-family: "Cascadia Code", Consolas, monospace; }
    .kill {
      background: var(--danger);
      color: #1e1e2e;
      padding: 4px 12px;
      font-size: 12px;
    }
    .kill:hover { background: var(--danger-hi); }
    .empty { padding: 40px; text-align: center; color: var(--muted); }
    #toast {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 10px 18px;
      border-radius: 8px;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      max-width: 80%;
    }
    #toast.show { opacity: 1; }
    #toast.err { border-color: var(--danger); color: var(--danger); }
  </style>
</head>
<body>
  <header>
    <h1>🔌 Port Watcher</h1>
    <input id="search" type="text" placeholder="Search by port, process, PID, address, or state…" autofocus />
    <label class="auto"><input type="checkbox" id="auto" /> Auto-refresh</label>
    <button id="refresh">Refresh</button>
    <span class="toolbar-info" id="count">—</span>
  </header>
  <div class="scroll">
    <table>
      <thead>
        <tr>
          <th data-sort="proto">Proto</th>
          <th data-sort="local">Local Address</th>
          <th data-sort="port">Port</th>
          <th data-sort="state">State</th>
          <th data-sort="process">Process</th>
          <th data-sort="pid">PID</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty" class="empty" hidden>No matching ports.</div>
  </div>
  <div id="toast"></div>
  <script src="renderer.js"></script>
</body>
</html>
